<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ism qoldiring</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  input, button { font-size: 16px; padding: 10px; }
  button { background: #2b6cb0; color: #fff; border: 0; border-radius: 6px; }
  #msg { margin: 10px 0; min-height: 20px; }
  .ok { color: #2f855a; }
  .err { color: #c53030; }
  li { margin: 8px 0; }
</style>
</head>
<body>
<h1>Ismingizni qoldiring</h1>
<form id="f">
  <input id="name" placeholder="Ism" required>
  <button type="submit">Saqlash</button>
</form>
<div id="msg"></div>
<ul id="list"></ul>
<script>
const API = '/.netlify/functions/api/notes';

async function yukla() {
  try {
    const r = await fetch(API);
    const data = await r.json();
    document.getElementById('list').innerHTML =
      data.map(n => `<li>${n.name}</li>`).join('');
  } catch (e) {
    show('O\'qishda xato: ' + e.message, 'err');
  }
}

function show(text, cls) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = cls;
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('name').value;
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok) {
      show('Saqlandi ✓', 'ok');
      document.getElementById('name').value = '';
      yukla();
    } else {
      show('Saqlashda xato (' + r.status + '): ' + (data.error || 'noma\'lum'), 'err');
    }
  } catch (e) {
    show('Ulanish xatosi: ' + e.message, 'err');
  }
});
yukla();
</script>
</body>
</html>
